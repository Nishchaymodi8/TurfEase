<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registered Users</title>
    <style>
      body {
        background-color: #ccc5b9;
        font-family: "Times New Roman", Times, serif;
      }
      .container {
        width: 80%;
        margin: 5vh auto;
        background-color: #043927;
        padding: 2rem;
        border-radius: 20px;
        color: #ccc5b9;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background-color: #ccc5b9;
        color: #043927;
      }
      th,
      td {
        border: 1px solid #043927;
        padding: 10px;
        text-align: center;
      }
      th {
        background-color: #043927;
        color: #ccc5b9;
      }
      h2 {
        text-align: center;
        color: #ccc5b9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Registered Users</h2>
      {% if users %}
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role.name }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <p>No users found.</p>
      {% endif %}
    </div>
  </body>
</html>
