{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="{% static 'css/signup.css' %}" />
    <style>
 .img {
  background-image: url("/static/imgs/about.png");
  height: 83vh;
  width: 30vw;
  background-repeat: no-repeat;
  background-size: cover;
  border-radius: 50px;
  margin-top: 5vh;
}


    </style>
  </head>
  <body>
    <div class="container">
      <form
        method="post"
        action="/turfapp/templates/signup.html/"
        class="row mt-5"
      >

        <div class="part1">
          <p class="formhead">Signup</p>
          <hr />
          
            <div class="form-row">
              <div class="col-md-4 mb-3">
                <label for="validationServer01">Name</label>
                <input
                  type="text"
                  class="form-control is-valid"
                  id="validationServer01"
                  placeholder="Name"
                  required
                />
              </div>
              <div class="col-md-4 mb-3">
                <label for="validationServer02">Email</label>
                <input
                  type="email"
                  class="form-control is-valid"
                  id="validationServer02"
                  placeholder="Email"
                  required
                />
              </div>
            </div>
            <div class="form-row">
              <div class="col-md-6 mb-3">
                <label for="validationServer03">Mobile Number</label>
                <input
                  type="number"
                  class="form-control is-invalid"
                  id="validationServer03"
                  placeholder="Mobile Number"
                  required
                />
              </div>
              <div class="col-md-3 mb-3">
                <label for="validationServer04">City</label>
                <input
                  type="text"
                  class="form-control is-invalid"
                  id="validationServer04"
                  placeholder="City"
                  required
                />
              </div>
              <div class="col-md-3 mb-3">
                <label for="validationServer05">Password</label>
                <input
                  type="text"
                  class="form-control is-invalid"
                  id="validationServer05"
                  placeholder="Password"
                  required
                />
              </div>
            </div>
            <div class="loginpart">
              <a class="loginlink" href="login.html"
                >>> If you already have an account</a
              >
            </div>
            <button class="btn btn-primary" type="submit"><a href="login.html" class="submitbutton">Submit</a></button>
          </form>
        </div>
        <div class="part2">
          <div class="img"></div>
        </div>
    </div>
  </body>
</html>
