{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="{% static 'css/signup.css' %}" />
    <style>
      .img {
        background-image: url("{% static 'imgs/about.png' %}");
        height: 83vh;
        width: 30vw;
        background-repeat: no-repeat;
        background-size: cover;
        border-radius: 50px;
        margin-top: 5vh;
      }
      * {
        margin: 0;
        padding: 0;
      }
      body {
        /*background-image: url(imgs/about.png);
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;*/
        background-color: #ccc5b9;
      }
      .container {
        margin: auto;
        margin-top: 5vh;
        height: 93vh;
        width: 80vw;
        background-color: #043927;

        border-radius: 50px;
        display: flex;
        justify-content: space-around;
      }

      .formhead {
        font-size: 3rem;
        text-align: center;
        margin-top: 8vh;
        font-weight: bold;
        color: #ccc5b9;
      }
      form {
        color: #ccc5b9;
        margin-left: 3vw;
        font-size: 1rem;
        margin-top: 3vh;
      }
      input {
        margin-left: 2vw;
        margin-bottom: 5vh;
        background-color: #ccc5b9;
        border-radius: 20px;
        border: 1px solid #ccc5b9;
        padding-left: 1vw;
        font-size: 1rem;
        font-family: "Times New Roman", Times, serif;
      }
      button {
        height: 7vh;
        width: 10vw;
        font-size: 1rem;
        border-radius: 50px;
        border: 1px solid #ccc5b9;
        background-color: #ccc5b9;
        color: #043927;
        margin-left: 3vw;
        margin-top: 2vh;
      }
      button:hover {
        border: 3px solid #043927;
        text-decoration: underline;
      }
      .loginlink {
        color: #ccc5b9;
        text-decoration: underline;
        font-size: 0.8rem;
        padding-left: 8vw;
      }
      .submitbutton {
        text-decoration: none;
        color: #043927;
      }
      .errorsection {
        margin-top: 5vh;
        width: 30vw;
      }
      #error {
        color: red;
      }
      #success {
        color: green;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <form method="POST" action="">
        {% csrf_token %}
        <div class="part1">
          <p class="formhead">Signup</p>
          <hr />
          <br />
          <div class="form-row">
            <div class="col-md-4 mb-3">
              <label for="name">Name</label>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                placeholder="Name"
                required
              />
            </div>

            <div class="col-md-4 mb-3">
              <label for="email">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Email"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="col-md-6 mb-3">
              <label for="mobile">Mobile Number</label>
              <input
                type="number"
                class="form-control"
                id="mobile"
                name="mobile"
                placeholder="Mobile Number"
                required
              />
            </div>

            <div class="col-md-3 mb-3">
              <label for="city">City</label>
              <input
                type="text"
                class="form-control"
                id="city"
                name="city"
                placeholder="City"
                required
              />
            </div>

            <div class="col-md-3 mb-3">
              <label for="password">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Password"
                required
              />
            </div>
          </div>

          <div class="loginpart">
            <a class="loginlink" href="{% url 'login' %}">
              >> Already have an account? Login
            </a>
          </div>
          <div class="errorsection">
            {% if success is not None %}
            <div class="row mt-4">
              <div
                class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1"
              >
                <div
                  class="alert alert-success mb-0 alert-dismissible fade show shadow"
                  role="alert"
                  id="success"
                >
                  {{ success }}
                </div>
              </div>
            </div>
            {% elif error is not None %}
            <div class="row mt-4">
              <div
                class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1"
                id="error"
              >
                <div
                  class="alert alert-danger mb-0 alert-dismissible fade show shadow"
                  role="alert"
                >
                  {{ error }}
                </div>
              </div>
            </div>
            {% endif %}
          </div>

          <button class="submitbutton" type="submit">Submit</button>
        </div>
      </form>

      <div class="part2">
        <div class="img"></div>
      </div>
    </div>
  </body>
</html>
