{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <style>
      .img {
        background-image: url("/static/imgs/about.png");
        height: 83vh;
        width: 30vw;
        background-repeat: no-repeat;
        background-size: cover;
        border-radius: 50px;
        margin-top: 5vh;
      }
      .errorsection {
        margin-top: 5vh;
        width: 30vw;
        text-align: center;
      }
      #error {
        color: red;
        background-color: #f3bcba;
        border: 1px solid red;
      }
      #success {
        color: green;
        background-color: #e0f2c0;
        border: 1px solid green;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="part2">
        <div class="img"></div>
      </div>
      <div class="part1">
        <p class="formhead">Login</p>
        <hr />
        <form method="post" action="">
          {% csrf_token%}
          <div class="form-group">
            <label for="exampleInputEmail1">Email</label>
            <input
              type="email"
              name="email"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
              placeholder="Enter email"
            />
          </div>
          <div class="form-group">
            <label for="exampleInputPassword1">Password</label>
            <input
              type="password"
              name="password"
              class="form-control"
              id="exampleInputPassword1"
              placeholder="Password"
            />
          </div>
          <div class="loginpart">
            <a class="loginlink" href="signup.html"
              >>> If you don't have an account</a
            >
          </div>
          <div class="errorsection">
            {% if success is not None %}
            <div class="row mt-4">
              <div
                class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1"
              >
                <div
                  class="alert alert-success mb-0 alert-dismissible fade show shadow"
                  role="alert"
                  id="success"
                >
                  {{ success }}
                </div>
              </div>
            </div>
            {% elif error is not None %}
            <div class="row mt-4">
              <div
                class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1"
                id="error"
              >
                <div
                  class="alert alert-danger mb-0 alert-dismissible fade show shadow"
                  role="alert"
                >
                  {{ error }}
                </div>
              </div>
            </div>
            {% endif %}
          </div>

          <button class="submitbutton" type="submit">Submit</button>
        </form>
      </div>
    </div>
  </body>
</html>
