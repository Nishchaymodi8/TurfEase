{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <style>
      .img {
        background-image: url("/static/imgs/about.png");
        height: 83vh;
        width: 30vw;
        background-repeat: no-repeat;
        background-size: cover;
        border-radius: 50px;
        margin-top: 5vh;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="part2">
        <div class="img"></div>
      </div>
      <div class="part1">
        <p class="formhead">Login</p>
        <hr />
        <form>
          <div class="form-group">
            <label for="exampleInputEmail1">Email</label>
            <input
              type="email"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
              placeholder="Enter email"
            />
          </div>
          <div class="form-group">
            <label for="exampleInputPassword1">Password</label>
            <input
              type="password"
              class="form-control"
              id="exampleInputPassword1"
              placeholder="Password"
            />
          </div>
          <div class="loginpart">
            <a class="loginlink" href="signup.html"
              >>> If you don't have an account</a
            >
          </div>
          <button type="submit" class="btn btn-primary">
            <a href="home.html" class="submitbutton">Submit</a>
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
