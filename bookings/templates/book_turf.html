{% extends "header.html" %} {% block content %}

<style>
  .booking-card {
    max-width: 750px;
    margin: 60px auto;
    background: #ffffff;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
  }

  .slot-container {
    margin-top: 20px;
  }

  .slot-wrapper {
    display: inline-block;
    margin: 8px;
  }

  .slot-card {
    display: inline-block;
    padding: 10px 18px;
    border: 2px solid #198754;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s ease-in-out;
  }

  .slot-card:hover {
    background-color: #e9f7ef;
  }

  input[type="checkbox"]:checked + .slot-card {
    background-color: #198754;
    color: white;
    transform: scale(1.05);
  }

  .price-box {
    background: #f8f9fa;
    padding: 25px;
    border-radius: 12px;
    margin-top: 30px;
    display: none;
    text-align: center;
  }

  .pay-btn {
    margin-top: 15px;
    width: 100%;
    font-size: 16px;
  }
</style>

<div class="container">
  <div class="booking-card">
    <h2 class="text-center mb-4">Book {{ turf.name }}</h2>

    <label class="form-label fw-semibold">Select Date</label>
    <input type="date" id="datePicker" min="{{ today }}" class="form-control" />

    <form id="bookingForm">
      {% csrf_token %}
      <input type="hidden" name="date" id="selectedDate" />

      <div id="slots" class="slot-container"></div>

      <button type="submit" class="btn btn-success mt-4 w-100">
        Confirm Booking
      </button>
    </form>

    <div id="priceSection" class="price-box">
      <h4>Total Price: ₹ <span id="totalPrice"></span></h4>
      <button class="btn btn-primary pay-btn">Pay Now</button>
    </div>
  </div>
</div>

<!-- Razorpay Script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
  const datePicker = document.getElementById("datePicker");
  const slotsDiv = document.getElementById("slots");
  const selectedDate = document.getElementById("selectedDate");
  const priceSection = document.getElementById("priceSection");
  const totalPriceSpan = document.getElementById("totalPrice");

  // ----------------------------
  // LOAD SLOTS
  // ----------------------------
  datePicker.addEventListener("change", () => {
    selectedDate.value = datePicker.value;
    priceSection.style.display = "none";
    slotsDiv.innerHTML = "Loading...";

    fetch(`/api/slots/{{ turf.id }}/?date=${datePicker.value}`)
      .then((res) => res.json())
      .then((data) => {
        slotsDiv.innerHTML = "";

        if (data.slots.length === 0) {
          slotsDiv.innerHTML = "<p>No slots available</p>";
          return;
        }

        data.slots.forEach((slot, index) => {
          slotsDiv.innerHTML += `
            <div class="slot-wrapper">
              <input type="checkbox" id="slot${index}" name="slots" value="${slot}" hidden>
              <label for="slot${index}" class="slot-card">
                ${slot}
              </label>
            </div>
          `;
        });
      });
  });

  // ----------------------------
  // CONFIRM BOOKING (Calculate price only)
  // ----------------------------
  document
    .getElementById("bookingForm")
    .addEventListener("submit", function (e) {
      e.preventDefault();

      fetch("{% url 'confirm_booking' turf.id %}", {
        method: "POST",
        headers: {
          "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]")
            .value,
        },
        body: new FormData(this),
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.success) {
            totalPriceSpan.innerText = data.total_price;
            priceSection.style.display = "block";
            priceSection.scrollIntoView({ behavior: "smooth" });
          } else {
            alert(data.error);
          }
        });
    });

  // ----------------------------
  // PAY NOW (Create Order + Verify)
  // ----------------------------
  document.querySelector(".pay-btn").addEventListener("click", function () {
    const amount = totalPriceSpan.innerText;

    fetch("{% url 'create_order' turf.id %}", {
      method: "POST",
      headers: {
        "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]")
          .value,
        "Content-Type": "application/x-www-form-urlencoded",
      },
      body: `amount=${amount}`,
    })
      .then((res) => res.json())
      .then((data) => {
        var options = {
          key: data.key,
          amount: data.amount * 100,
          currency: "INR",
          name: "Turfease",
          description: "Turf Booking Payment",
          order_id: data.order_id,

          handler: function (response) {
            fetch("{% url 'verify_payment' turf.id %}", {
              method: "POST",
              headers: {
                "X-CSRFToken": document.querySelector(
                  "[name=csrfmiddlewaretoken]",
                ).value,
                "Content-Type": "application/x-www-form-urlencoded",
              },
              body:
                `razorpay_payment_id=${response.razorpay_payment_id}` +
                `&razorpay_order_id=${response.razorpay_order_id}` +
                `&razorpay_signature=${response.razorpay_signature}`,
            })
              .then((res) => res.json())
              .then((result) => {
                if (result.success) {
                  window.location.href = result.redirect_url;
                } else {
                  alert("Payment verification failed.");
                }
              });
          },

          theme: {
            color: "#198754",
          },
        };

        var rzp = new Razorpay(options);
        rzp.open();
      });
  });
</script>

{% endblock %}
