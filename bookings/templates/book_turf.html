{% extends "header.html" %} {% block content %}

<style>
  .booking-container {
    max-width: 600px;
    margin: 40px auto;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
  }

  .booking-container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #043927;
  }

  label {
    font-weight: 600;
    margin-top: 15px;
    display: block;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  .submit-btn {
    margin-top: 25px;
    width: 100%;
    padding: 12px;
    background: #198754;
    color: #fff;
    font-size: 16px;
    border-radius: 6px;
    border: none;
  }

  .submit-btn:hover {
    background: #157347;
  }
</style>

<div class="booking-container">
  <h2>Book {{ turf.name }}</h2>

  <form method="post">
    {% csrf_token %}

    <label>Date</label>
    <input type="date" name="date" required />

    <label>Start Time</label>
    <input type="time" name="start_time" required />

    <label>End Time</label>
    <input type="time" name="end_time" required />

    <button type="submit" class="submit-btn">Confirm Booking</button>
  </form>
</div>

{% endblock %}
