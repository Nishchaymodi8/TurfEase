{% extends "header.html" %} {% block content %}

<style>
  .turf-container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
  }

  .turf-container h1 {
    text-align: center;
    margin-bottom: 25px;
  }

  .turf-table {
    width: 100%;
    border-collapse: collapse;
    background-color: #ffffff;
  }

  .turf-table th,
  .turf-table td {
    padding: 12px;
    text-align: left;
    border: 1px solid #ddd;
  }

  .turf-table th {
    background-color: #043927;
    color: white;
  }

  .turf-table tr:nth-child(even) {
    background-color: #f9f9f9;
  }

  .no-data {
    text-align: center;
    padding: 15px;
    color: #555;
  }

  .view-btn {
    padding: 6px 12px;
    background-color: #198754;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-size: 14px;
  }

  .view-btn:hover {
    background-color: #157347;
  }
</style>

<div class="turf-container">
  <h1>Available Turfs</h1>

  <table class="turf-table">
    <tr>
      <th>Name</th>
      <th>Location</th>
      <th>Price / Hour</th>
      <th>Action</th>
    </tr>

    {% if turfs %} {% for turf in turfs %}
    <tr>
      <td>{{ turf.name }}</td>
      <td>{{ turf.location }}</td>
      <td>₹ {{ turf.price_per_hour }}</td>
      <td>
        <a href="{% url 'turf-detail' turf.id %}" class="view-btn"> View </a>
      </td>
    </tr>
    {% endfor %} {% else %}
    <tr>
      <td colspan="4" class="no-data">No turfs available</td>
    </tr>
    {% endif %}
  </table>
</div>

{% endblock %}
