<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Turfease</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f6f8;
      }

      /* Navbar */
      .navbar {
        background-color: #043927;
        padding: 14px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .navbar-left {
        font-size: 20px;
        font-weight: bold;
        color: #ffffff;
      }

      .navbar-links a {
        color: #ffffff;
        text-decoration: none;
        margin-left: 18px;
        font-size: 15px;
      }

      .navbar-links a:hover {
        text-decoration: underline;
      }

      /* Page content */
      .content {
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <div class="navbar-left">Turfease</div>

      <div class="navbar-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'list-turfs' %}">Turfs</a>
        <a href="{% url 'logout' %}">Log out</a>
      </div>
    </div>

    <div class="content">{% block content %}{% endblock %}</div>
  </body>
</html>
